name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    # GitHub hard limit is 360 minutes (6 hours)
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          # NLA stays ON (1) - all modern RDP clients support it
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          # 3 = Negotiate (encrypted). Never 0 - that is RDP without encryption
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 3 -Force

      - name: Allow RDP from Tailscale only
        run: |
          # remoteip=100.64.0.0/10 = Tailscale subnet.
          # Without this rule RDP is open to the whole internet.
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

      - name: Create RDP User with Secure Password
        run: |
          $chars = [char[]](65..90) + [char[]](97..122) + [char[]](48..57) +
                   [char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126)
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $buf = New-Object 'byte[]' 24
          $rng.GetBytes($buf)
          $password = -join ($buf | % { $chars[($_ % $chars.Length)] })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires
          } else {
            New-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          # stable URL = always the latest build, nothing to go stale
          curl.exe -fSL -o "$env:TEMP\tailscale.msi" https://pkgs.tailscale.com/stable/tailscale-setup-amd64.msi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          Remove-Item "$env:TEMP\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TAILSCALE_AUTH_KEY) { Write-Error "TAILSCALE_AUTH_KEY secret is missing"; exit 1 }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTH_KEY" --hostname=gh-runner-$env:GITHUB_RUN_ID

          # Wait until the node is actually online
          $tsIP = $null
          for ($i = 0; $i -lt 12; $i++) {
            $status = & "$env:ProgramFiles\Tailscale\tailscale.exe" status --json | ConvertFrom-Json
            if ($status.Self.Online) { $tsIP = $status.Self.TailscaleIPs[0]; break }
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) { Write-Error "Tailscale IP not assigned. Exiting."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"

          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - cancel the workflow to stop billing"
            Start-Sleep -Seconds 300
          }
